[project]
name = "culler-evals"
version = "0.1.0"
description = "Developer evaluations for Culler agent directives"
requires-python = ">=3.11"
dependencies = ["gepa==0.1.4", "playwright==1.58.0"]

[project.optional-dependencies]
tracking = ["mlflow>=3.0,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
culler-evals = "culler_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["culler_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
