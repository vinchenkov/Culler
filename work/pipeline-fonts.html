<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Manrope:wght@500&family=Space+Grotesk:wght@500&display=swap">
<style>
  #pipeline-fonts { color-scheme: light; }
  #pipeline-fonts .font-choice { padding: 18px 12px 22px; }
  #pipeline-fonts .font-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 16px; }
  #pipeline-fonts .font-heading h3 { margin: 0; }
  #pipeline-fonts .font-heading a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  #pipeline-fonts .pipeline-preview { --pipeline-ink: #244363; --pipeline-muted: #53667a; --pipeline-line: #dce2e8; --pipeline-paper: #fffcf6; --pipeline-active: #e4e9ed; --pipeline-accent: #385e83; padding: 20px; border: 1px solid #e6e2db; border-radius: 16px; background: var(--pipeline-paper); color: var(--pipeline-ink); font: 400 13px/1.45 'Figtree', sans-serif; }
  #pipeline-fonts .pipeline-heading { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  #pipeline-fonts .pipeline-heading strong { display: block; font-size: 19px; font-weight: 700; }
  #pipeline-fonts .pipeline-heading p { margin: 5px 0 0; color: var(--pipeline-muted); font-size: 12px; }
  #pipeline-fonts .pipeline-run { align-self: flex-start; border-radius: 4px; padding: 2px 6px; background: #efefec; color: var(--pipeline-muted); font-size: 11px; font-weight: 600; }
  #pipeline-fonts .pipeline-stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  #pipeline-fonts .pipeline-stage { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 14px 11px; border: 1px solid var(--pipeline-line); border-radius: 12px; background: #ffffff; }
  #pipeline-fonts .pipeline-stage[data-active] { background: var(--pipeline-active); border-color: #92a8bd; box-shadow: inset 0 3px var(--pipeline-accent); }
  #pipeline-fonts .pipeline-stage:not(:last-child)::after { content: '→'; position: absolute; top: 86px; right: -12px; color: var(--pipeline-muted); z-index: 1; }
  #pipeline-fonts .pipeline-stage-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
  #pipeline-fonts .pipeline-number { font-family: var(--number-font, 'Figtree'), sans-serif; font-size: 32px; line-height: 1; font-weight: 500; font-variant-numeric: lining-nums tabular-nums; color: var(--pipeline-muted); }
  #pipeline-fonts .pipeline-egg { width: 15px; height: 21px; flex: none; border: 1.3px solid var(--pipeline-accent); border-radius: 52% 52% 47% 47% / 63% 63% 40% 40%; background: #f4ecdd; }
  #pipeline-fonts [data-active] .pipeline-egg { background: #9fc4e8; }
  #pipeline-fonts .pipeline-role { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
  #pipeline-fonts .pipeline-purpose { min-height: 42px; margin-top: 5px; color: var(--pipeline-muted); font-size: 12px; }
  #pipeline-fonts .pipeline-state { margin-top: 15px; font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
  #pipeline-fonts .pipeline-state::before { content: '●'; margin-right: 4px; font-size: 9px; }
  #pipeline-fonts .pipeline-time { margin-top: 6px; margin-bottom: 14px; color: var(--pipeline-muted); font-size: 11px; }
  #pipeline-fonts .pipeline-count { display: flex; gap: 5px; align-items: baseline; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--pipeline-line); color: var(--pipeline-muted); font-size: 11px; }
  #pipeline-fonts .pipeline-count b { color: var(--pipeline-ink); font-size: 18px; font-weight: 500; }
  #pipeline-fonts .pipeline-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--pipeline-line); color: var(--pipeline-muted); font-size: 11px; }
  #pipeline-fonts .pipeline-footer span:last-child { color: #386548; font-weight: 600; }
  @media(max-width: 600px) {
    #pipeline-fonts .pipeline-stages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #pipeline-fonts .pipeline-stage:not(:last-child)::after { content: none; }
    #pipeline-fonts .pipeline-purpose { min-height: 34px; }
    #pipeline-fonts .pipeline-state { margin-top: 10px; }
    #pipeline-fonts .pipeline-preview { padding: 14px; }
    #pipeline-fonts .font-choice { padding: 12px 4px 18px; }
  }
</style>
<div id="pipeline-fonts" class="viz-carousel viz-dotted-background" aria-label="Five fonts for the pipeline numbers">
  <section class="font-choice" data-variant="Figtree" style="--number-font:'Figtree'">
    <div class="font-heading"><h3><a href="https://fonts.google.com/specimen/Figtree" target="_blank" rel="noopener noreferrer">Figtree</a></h3><span class="text-small text-muted">Matches the page text · 32 px · Medium</span></div>
    <div class="pipeline-preview" aria-label="Pipeline with Figtree numbers"></div>
  </section>
  <section class="font-choice" data-variant="Space Grotesk" style="--number-font:'Space Grotesk'" hidden>
    <div class="font-heading"><h3><a href="https://floriankarsten.github.io/space-grotesk/" target="_blank" rel="noopener noreferrer">Space Grotesk</a></h3><span class="text-small text-muted">Geometric · 32 px · Medium</span></div>
    <div class="pipeline-preview" aria-label="Pipeline with Space Grotesk numbers"></div>
  </section>
  <section class="font-choice" data-variant="Manrope" style="--number-font:'Manrope'" hidden>
    <div class="font-heading"><h3><a href="https://fonts.google.com/specimen/Manrope" target="_blank" rel="noopener noreferrer">Manrope</a></h3><span class="text-small text-muted">Rounded · 32 px · Medium</span></div>
    <div class="pipeline-preview" aria-label="Pipeline with Manrope numbers"></div>
  </section>
  <section class="font-choice" data-variant="IBM Plex Mono" style="--number-font:'IBM Plex Mono'" hidden>
    <div class="font-heading"><h3><a href="https://www.ibm.com/design/language/typography/typeface/" target="_blank" rel="noopener noreferrer">IBM Plex Mono</a></h3><span class="text-small text-muted">Monospace · 32 px · Medium</span></div>
    <div class="pipeline-preview" aria-label="Pipeline with IBM Plex Mono numbers"></div>
  </section>
  <section class="font-choice" data-variant="Barlow Condensed" style="--number-font:'Barlow Condensed'" hidden>
    <div class="font-heading"><h3><a href="https://fonts.google.com/specimen/Barlow+Condensed" target="_blank" rel="noopener noreferrer">Barlow Condensed</a></h3><span class="text-small text-muted">Narrow · 32 px · Medium</span></div>
    <div class="pipeline-preview" aria-label="Pipeline with Barlow Condensed numbers"></div>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('pipeline-fonts');
  const stages = [
    { number: '01', role: 'Strategist', purpose: 'Proposes two tasks', state: 'Idle', time: 'last run 11m ago', count: '0', result: 'Proposed' },
    { number: '02', role: 'Arbiter', purpose: 'Selects proposed tasks', state: 'Idle', time: 'last run 8m ago', count: '1', result: 'Seeded' },
    { number: '03', role: 'Worker', purpose: 'Implements a task', state: 'Agent launch pending', time: 'on Culler · 6m', count: '0', result: 'Worked', active: true },
    { number: '04', role: 'Verifier', purpose: 'Checks the deliverable', state: 'Idle', time: 'no runs yet', count: '0', result: 'Verified' },
    { number: '05', role: 'Packager', purpose: 'Prepares the review packet', state: 'Idle', time: 'no runs yet', count: '0', result: 'Packaged' }
  ];
  function element(tag, className, text) {
    const node = document.createElement(tag);
    node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  root.querySelectorAll('.pipeline-preview').forEach(preview => {
    const heading = element('div', 'pipeline-heading');
    const title = element('div', 'pipeline-title');
    title.append(element('strong', '', 'Task path'), element('p', '', 'Select a role for its details.'));
    heading.append(title, element('span', 'pipeline-run', '1 task run'));
    const cards = element('div', 'pipeline-stages');
    stages.forEach(stage => {
      const card = element('div', 'pipeline-stage');
      if (stage.active) card.setAttribute('data-active', '');
      const top = element('div', 'pipeline-stage-top');
      const egg = element('span', 'pipeline-egg');
      egg.setAttribute('aria-hidden', 'true');
      top.append(element('span', 'pipeline-number', stage.number), egg);
      const count = element('div', 'pipeline-count');
      count.append(element('b', '', stage.count), element('span', '', stage.result));
      card.append(top, element('div', 'pipeline-role', stage.role), element('div', 'pipeline-purpose', stage.purpose), element('div', 'pipeline-state', stage.state), element('div', 'pipeline-time', stage.time), count);
      cards.append(card);
    });
    const footer = element('div', 'pipeline-footer');
    footer.append(element('span', '', 'The Packager prepares a packet for operator review.'), element('span', '', '0 tasks at Packaged'));
    preview.append(heading, cards, footer);
  });
})();
</script>
