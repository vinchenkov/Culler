  .legend-t { font: 400 14px -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif; fill: #a6b6c5; }
  .legend-mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.9px; }
