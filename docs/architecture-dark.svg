  .label-blue { font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif; fill: #84b9e8; }
  .label-orange { font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif; fill: #f0935c; }
  .label-green { font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif; fill: #7ccf9a; }
  .ink-blue { fill: #84b9e8; }
  .ink-orange { fill: #f0935c; }
  .end { text-anchor: end; }
  .mid { text-anchor: middle; }
  .line-blue { fill: none; stroke: #84b9e8; stroke-width: 2.4; }
  .line-orange { fill: none; stroke: #f0935c; stroke-width: 2.4; }
  .line-green { fill: none; stroke: #7ccf9a; stroke-width: 2.4; }
  .line-gray { fill: none; stroke: #8d9cab; stroke-width: 1.7; }
  .head-blue { fill: #84b9e8; }
  .head-orange { fill: #f0935c; }
  .head-green { fill: #7ccf9a; }
