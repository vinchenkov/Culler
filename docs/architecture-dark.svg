<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 872" width="1360" height="872" role="img" aria-labelledby="title desc">
<title id="title">The architecture of Culler</title>
<desc id="desc">FIG. 3, architecture. On your Mac, the Browser opens the dashboard. The dashboard reaches AgentsView through a local proxy and serves OpenWiki. The dashboard and the resident run mc on the host. That mc reads and writes the spine. Inside Docker Desktop, the spine is one SQLite database in a named volume. The resident starts each agent container. Each agent container runs mc inside the container and reads and writes the spine. The Project repositories supply a fresh source workspace for each run, mounted at /workspace/source, and keep the result commit after the run. Provider credentials stay in the macOS Keychain. mc reads them for the provider proxy in the resident. Agent containers send model requests with a temporary Culler token to the proxy. The proxy adds the credentials and sends each request to the model provider. Agent containers hold no provider credentials. Discord is optional.</desc>
<style>
