  .strong { font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", sans-serif; fill: #e8eef4; }
  .code { font: 600 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
