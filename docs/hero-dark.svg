  .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: #edf3fa; }
  .flow { fill: none; stroke: #93c3ee; stroke-width: 2; }
  .ret { fill: none; stroke: #a9c6e2; stroke-width: 1.6; stroke-dasharray: 7 5; }
  .tap { fill: none; stroke: #b6c6d7; stroke-width: 1.4; stroke-dasharray: 1.5 4; stroke-linecap: round; }
  .box { fill: #192c3e; stroke: #93c3ee; stroke-width: 1.5; }
  .thin { fill: none; stroke: #3b5065; stroke-width: 1; }

  .line { fill: none; stroke: #3b5065; stroke-width: 2; }
  .prog { fill: none; stroke: #93c3ee; stroke-width: 3; stroke-linecap: round;
          stroke-dasharray: 855 855; stroke-dashoffset: 0; animation: dash 12.0s linear infinite; }
  .token { animation: move 12.0s cubic-bezier(.45,0,.25,1) infinite; }
  .token path { fill: #5fa57c; opacity: 0; animation: tfill 12.0s linear infinite, tfade 12.0s linear infinite; }
  .lit { opacity: 1; }
  .check { opacity: 1; animation: check 12.0s linear infinite; }
  @keyframes move { 0.00% { transform: translateX(0px); } 6.67% { transform: translateX(0px); } 11.67% { transform: translateX(125px); } 18.33% { transform: translateX(125px); } 23.33% { transform: translateX(240px); } 30.00% { transform: translateX(240px); } 35.00% { transform: translateX(355px); } 41.67% { transform: translateX(355px); } 46.67% { transform: translateX(470px); } 53.33% { transform: translateX(470px); } 58.33% { transform: translateX(585px); } 65.00% { transform: translateX(585px); } 71.67% { transform: translateX(720px); } 85.00% { transform: translateX(720px); } 91.67% { transform: translateX(855px); } 100.00% { transform: translateX(855px); } }
  @keyframes dash { 0.00% { stroke-dashoffset: 855; } 6.67% { stroke-dashoffset: 855; } 11.67% { stroke-dashoffset: 730; } 18.33% { stroke-dashoffset: 730; } 23.33% { stroke-dashoffset: 615; } 30.00% { stroke-dashoffset: 615; } 35.00% { stroke-dashoffset: 500; } 41.67% { stroke-dashoffset: 500; } 46.67% { stroke-dashoffset: 385; } 53.33% { stroke-dashoffset: 385; } 58.33% { stroke-dashoffset: 270; } 65.00% { stroke-dashoffset: 270; } 71.67% { stroke-dashoffset: 135; } 85.00% { stroke-dashoffset: 135; } 91.67% { stroke-dashoffset: 0; } 100.00% { stroke-dashoffset: 0; } }
  @keyframes tfill { 0.00% { fill: #b6c6d7; } 6.58% { fill: #b6c6d7; } 11.67% { fill: #e2763c; } 18.25% { fill: #e2763c; } 23.33% { fill: #86abd0; } 29.92% { fill: #86abd0; } 35.00% { fill: #6e9ccb; } 41.58% { fill: #6e9ccb; } 46.67% { fill: #5b8ec6; } 53.25% { fill: #5b8ec6; } 58.33% { fill: #5fa57c; } 64.92% { fill: #5fa57c; } 71.67% { fill: #5fa57c; } 84.92% { fill: #5fa57c; } 91.67% { fill: #5fa57c; } 99.92% { fill: #5fa57c; } }
  @keyframes tfade { 0% { opacity: 0; } 2% { opacity: 1; } 96% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes check { 0% { opacity: 0; } 76.67% { opacity: 0; } 79.17% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes lit0 { 0% { opacity: 0; } 0.00% { opacity: 0; } 2.50% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } } @keyframes lit1 { 0% { opacity: 0; } 11.67% { opacity: 0; } 14.17% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } } @keyframes lit2 { 0% { opacity: 0; } 23.33% { opacity: 0; } 25.83% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } } @keyframes lit3 { 0% { opacity: 0; } 35.00% { opacity: 0; } 37.50% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } } @keyframes lit4 { 0% { opacity: 0; } 46.67% { opacity: 0; } 49.17% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } } @keyframes lit5 { 0% { opacity: 0; } 58.33% { opacity: 0; } 60.83% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } } @keyframes lit6 { 0% { opacity: 0; } 76.67% { opacity: 0; } 79.17% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } } @keyframes lit7 { 0% { opacity: 0; } 91.67% { opacity: 0; } 94.17% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }
  .lit0 { animation: lit0 12.0s linear infinite; } .lit1 { animation: lit1 12.0s linear infinite; } .lit2 { animation: lit2 12.0s linear infinite; } .lit3 { animation: lit3 12.0s linear infinite; } .lit4 { animation: lit4 12.0s linear infinite; } .lit5 { animation: lit5 12.0s linear infinite; } .lit6 { animation: lit6 12.0s linear infinite; } .lit7 { animation: lit7 12.0s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .prog, .token, .token path, .check, .lit0, .lit1, .lit2, .lit3, .lit4, .lit5, .lit6, .lit7 { animation: none; }
    .token path { opacity: 0; }
  }
</style>
