<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 238" width="1000" height="238" role="img" aria-labelledby="title desc">
<title id="title">The factory line of Culler</title>
<desc id="desc">One task moves from VISION.md through five numbered roles: 01 Strategist, 02 Arbiter, 03 Worker, 04 Verifier, and 05 Packager. Below each role, the db records the new stage of the task: Proposed, Seeded, Worked, Verified, and Packaged. At the end, you approve the packet, the db records Approved, and the change goes to the main branch.</desc>

<style>
