  .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; fill: #edf3fa; }
  .tag { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 600; letter-spacing: 1.6px; fill: #b6c6d7; }
  .name { font-size: 21px; font-weight: 700; }
  .title { font-size: 19px; font-weight: 700; }
  .body { font-size: 16px; fill: #b6c6d7; }
  .bodyink { font-size: 16px; fill: #edf3fa; }
  .small { font-size: 15px; fill: #b6c6d7; }
